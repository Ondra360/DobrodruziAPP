 catch(e){if(host.isConnected)host.querySelector('.bill').textContent=e.message}

const pendingReplies=new Map();
const columns=()=>groups.find(row=>row.id===g)?.group_sections||[];
const columnName=id=>columns().find(row=>row.id===id)?.name||'Kolonka';
const ownsColumns=()=>canWrite()&&(spaceRole()==='owner'||groups.find(row=>row.id===g)?.created_by===user?.id);
let columnId=null;
function visibleReply(item){
 const saved=item.lunch_responses.find(row=>row.user_id===user?.id);
 const pending=pendingReplies.get(item.id);
 return pending&&pending.user===user?.id?{...saved,...pending.desired}:saved;
}
function applyReply(item,who,value){
 const existing=item.lunch_responses.find(row=>row.user_id===who);
 if(existing)Object.assign(existing,value);
 else item.lunch_responses.push({...value,user_id:who});
}
async function quickReply(item,answer,option){
 if(!item||!user||!canWrite()||status(item)!=='Otevřeno')return;
 const who=user.id,previous=item.lunch_responses.find(r=>r.user_id===who);
 const desired={answer,option_id:answer==='yes'?option:null,note:previous?.note||''};
 if(answer==='yes'&&!option)throw Error('Vyber dostupnou variantu.');
 const inFlight=pendingReplies.get(item.id);
 if(inFlight&&inFlight.user===who){inFlight.desired=desired;render();return}
 const job={user:who,desired};pendingReplies.set(item.id,job);render();
 try{
  while(pendingReplies.get(item.id)===job&&user?.id===who){
   const sent=job.desired;try{
    await rpc('respond',{l:item.id,ans:sent.answer,opt:sent.option_id,note_text:sent.note});
    if(user?.id!==who)break;
    const current=lunches.find(l=>l.id===item.id);
    if(current)applyReply(current,who,sent);
   }catch(error){if(sent===job.desired)throw error}
   if(sent===job.desired)break;
  }
 }catch(error){toast('Odpověď se nepodařilo uložit. '+friendly(error))}
 finally{if(pendingReplies.get(item.id)===job){pendingReplies.delete(item.id);if(user?.id===who){++seq;render();queue()}}}
}
